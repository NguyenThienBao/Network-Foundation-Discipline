<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Structure</title>
    <link rel="icon" type="image/icon" href="./img/icon.icon" />
    <style type="text/css"> 
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: red;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Heading 1</h1>
    <p>This is a paragraph of text.</p>
    <ul>
        <li>List item 1</li>
        <li>List item 2</li>
        <li>List item 3</li>
    </ul>
</body>
</html>
