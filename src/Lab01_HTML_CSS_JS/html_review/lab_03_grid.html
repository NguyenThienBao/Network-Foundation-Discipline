<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        .container div {
            width: 100px;
            height: 75px;
            margin: 10px;
            background-color: #cc3366;
            color: #ffffff; 
            line-height: 75px;
            text-align: center;
        }

        .container {
            background-color: aqua;
            display: grid;
            grid-template-columns: 1fr 2fr 3fr;
            grid-template-rows: 100px 200px 300px;
        }

    </style>
</head>
<body>
    <h1>Flex - layout</h1>
    <div class="container">
        <div>item 1</div>
        <div>item 2</div>
        <div>item 3</div>
        <div>item 4</div>
        <div>item 5</div>
        <div>item 6</div>
        <div>item 7</div>
        <div>item 8</div>
        <div>item 9</div>
        <div>item 10</div>
        <div>item 11</div>
        <div>item 12</div>
        <div>item 13</div>
        <div>item 14</div>
        <div>item 15</div>
    </div>
</body>
</html>
