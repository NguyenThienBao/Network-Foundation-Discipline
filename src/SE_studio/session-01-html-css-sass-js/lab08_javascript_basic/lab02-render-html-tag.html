<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render HTML Tags</title>
</head>
<body>
    <h1>Using JS to create and render HTML tags</h1>
    <script type="text/javascript">
        let i = 0;
        for(i = 0; i < 10; i++) {
            document.write('<p>This is paragraph number ' + i + '</p>');
        }
        
        while(i < 20) {
            document.writeln('<div>Add item: ' + i + '</div>');
            i = i + 1;
        }
    </script>
</body>
</html>
