<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes management</title>
    <link rel="stylesheet" href="./css/lab10-app-recipes.css" />
</head>
<body>
    <div class="header">
        <h1>Coffee Brew Recipes</h1>
        <p>Add custom recipes for client</p>
    </div>

    <main>
        <form action="#" id="frm-recipes">
            <div class="input-item">
                <label for="txt-name">Name of recipes</label>
                <input type="text" required="required" id="txt-name" class="form-control" placeholder="Enter name of recipes" />
            </div>
            <div class="input-item">
                <label for="lst-method">Brew method</label>
                <select id="lst-method" class="form-control">
                    <option value="default">default</option>
                    <option value="hot">hot</option>
                    <option value="ice">ice</option>
                    <option value="middle">middle</option>
                </select>
            </div>
            <div class="input-item">
                <label for="txt-note">Notes <span>(option)</span></label>
                <input type="text" id="txt-note" class="form-control" />
            </div>
            <div class="input-item">
                <button type="submit">Add Recipes</button>
            </div>
        </form>
    </main>

    <div class="container">
        <h2>List of recipes</h2>
        <div class="lst-recipes"></div>
    </div>
    
    <script type="text/javascript" src="./js/lab10-app-recipes.js"></script>
</body>
</html>
