<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Application</title>
    <style type="text/css">
        .container {
            display: flex;
            flex-wrap: wrap;
            width: 17rem;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #94228d
        }

        #screen {
            border: 1px solid rgb(90, 87, 87);
            width: 16rem;
            height: 2rem;
            line-height: 2rem;
            color: #000000;
            text-align: right;
            padding: 0 10px;
            font-size: 1.25rem;
        }

        .btn {
            width: 4rem;
            height: 2rem;
            margin-bottom: 5px;
            font-style: bold;
        }

        .btn-ac, .btn-sign, .btn-percent {
            background-color: rgb(97, 94, 94, 0.3);
        }   

        .btn-div, .btn-mul, .btn-sub, .btn-add {
            background-color: rgb(230, 180, 101, 0.5);
        }

        .btn-equal {
            background-color: rgb(106, 162, 109, 0.5);
            height: 2rem;
            width: 8.25rem;
        }

        .btn-list {
            margin: 5px 0;
            background-color: rgba(163, 120, 120, 0.1);
        }
    </style>
</head>
<body>
    <h1>Calculator Application</h1>

    <div class="container">
        <div id="screen">0.</div>
            <div class="btn-list">
                <button type="button" class="btn btn-ac">AC</button>
                <button type="button" class="btn btn-sign">+/-</button>
                <button type="button" class="btn btn-percent">%</button>
                <button type="button" class="btn btn-div">/</button>
                <button type="button" class="btn btn-num-7">7</button>
                <button type="button" class="btn btn-num-8">8</button>
                <button type="button" class="btn btn-num-9">9</button>
                <button type="button" class="btn btn-mul">x</button>
                <button type="button" class="btn btn-num-4">4</button>
                <button type="button" class="btn btn-num-5">5</button>
                <button type="button" class="btn btn-num-6">6</button>
                <button type="button" class="btn btn-sub">-</button>
                <button type="button" class="btn btn-num-1">1</button>
                <button type="button" class="btn btn-num-2">2</button>
                <button type="button" class="btn btn-num-3">3</button>
                <button type="button" class="btn btn-add">+</button>
                <button type="button" class="btn btn-num-0">0</button>
                <button type="button" class="btn btn-dot">.</button>
                <button type="button" class="btn btn-equal">=</button>
            </div>
    </div>

    <script type="text/javascript">
        let value = '0';
        let memory = '0';
        let operator = null;
        let is_dot = false;
        let is_equal = false;
        let is_new = true;
        let value_screen = document.getElementById("screen");
        
        document.querySelector('.btn-num-1').addEventListener('click', addNum);
        document.querySelector('.btn-num-2').addEventListener('click', addNum);
        document.querySelector('.btn-num-3').addEventListener('click', addNum);
        document.querySelector('.btn-num-4').addEventListener('click', addNum);
        document.querySelector('.btn-num-5').addEventListener('click', addNum);
        document.querySelector('.btn-num-6').addEventListener('click', addNum);
        document.querySelector('.btn-num-7').addEventListener('click', addNum);
        document.querySelector('.btn-num-8').addEventListener('click', addNum);
        document.querySelector('.btn-num-9').addEventListener('click', addNum);
        document.querySelector('.btn-num-0').addEventListener('click', addNum);

        document.querySelector('.btn-dot').addEventListener('click', setDot);
        document.querySelector('.btn-ac').addEventListener('click', clear);
        document.querySelector('.btn-sign').addEventListener('click', setSign);

        document.querySelector('.btn-add').addEventListener('click', calOperator);
        document.querySelector('.btn-sub').addEventListener('click', calOperator);
        document.querySelector('.btn-mul').addEventListener('click', calOperator);
        document.querySelector('.btn-div').addEventListener('click', calOperator);

        document.querySelector('.btn-percent').addEventListener('click', setPercent);

        document.querySelector('.btn-equal').addEventListener('click', calTotal);

        function clear() {
            value = '0';
            memory = '0';
            operator = null;
            is_dot = false;
            is_equal = false;
            is_new = true;
            value_screen.innerText = "0.";
        }

        function addNum() {
            if (is_equal) {
                clear();
            }

            let num_val = this.innerText;

            if(value === '0') {
                value = num_val;
            } else {
                value = value + num_val;
            }
            
            value_screen.innerText = value + (is_dot ? "." : "");
        }

        function setDot() {
            if (is_dot === false) {
                value = value + ".";
                is_dot = true;
            }
        }

        function setSign() {
            if (value !== '0') {
                value = (value[0] === '-') ? value.substring(1) : '-' + value;
            }
            
            // Check if we need to display a trailing dot
            value_screen.innerText = value + (is_dot && !value.includes('.') ? "." : "");
        }

        function calOperator() {
            if (is_equal) {
                is_equal = false;
            } else if (!is_new) {
                calculate();
            } else {
                is_new = false;
            }

            value_screen.innerText = value + (is_dot ? "." : "");

            if (value !== 'Error div 0') {
                memory = value;
                operator = this.innerText;
                value = '0';
            }
        }
        
        function calculate() {
            let value_memory = parseFloat(memory);
            let value_current = parseFloat(value);

            let result = 0;

            switch (operator) {
                case '+':
                    result = value_memory + value_current;
                    break;
                case '-':
                    result = value_memory - value_current;
                    break;
                case 'x':
                    result = value_memory * value_current;
                    break;
                case '/':
                    if (value_current === 0) {
                        value_screen.innerText = "Error div 0";
                        return;
                    }
                    result = value_memory / value_current;
                    break;
            }

            value = result.toString();

            if (result > parseInt(value)) {
                is_dot = true;
            }

            value_screen.innerText = value + (is_dot ? "." : "");
        }

        function setPercent() {
            let value_current = parseFloat(value);
            value_current = value_current / 100;
            value = value_current.toString();

            if (value_current > parseInt(value)) {
                is_dot = true;
            }

            value_screen.innerText = value + (is_dot ? "." : "");
        }

        function calTotal() {
            calculate();
            value_screen.innerText = value + (is_dot ? "." : "");
            is_equal = true;
        }
    </script>
</body>
</html>
