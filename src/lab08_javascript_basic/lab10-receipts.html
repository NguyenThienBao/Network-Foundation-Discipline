<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipts</title>
    <link rel="stylesheet" href="./css/lab10-receipts.css" />
</head>
<body>
    <div class="header">
        <h1>Receipts For Coffee</h1>
        <p>Add Custom Receipts for client</p>
    </div>
<main>
    <form action="#" id="frmReceipts">
        <div class="input-item">
            <label for="txt-name">Name:</label>
            <input type="text" required="required" id="txt-name" name="txt-name" required />
        </div>
        <div class="input-item">
            <label for="lst-method">Brew Method:</label>
            <select id="lst-method" name="lst-method" required>
                <option value="">Select a method</option>
                <option value="drip">Drip</option>
                <option value="french-press">French Press</option>
                <option value="espresso">Espresso</option>
            </select>
        </div>
        <div class="input-item">
            <label for="txt-notes">Notes:</label>
            <input type="text" id="txt-notes" name="txt-notes" class="form-control" />
        </div>
        <div class="input-item">
            <button type="submit" id="btn-submit">Submit</button>
    </form>
</main>
    <div class="container">
        <h2>Receipts</h2>
        <div id="list-receipts"></div>
    </div>

    <script type="text/javascript" src="./js/lab10-receipts.js"></script>
</body>
</html>
